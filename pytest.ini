[pytest]
# Ensure the project root is on sys.path so tests can import `src.*`.
# Without this, pytest's sys.path insertion behavior depends on the
# invocation form (`pytest` vs `python -m pytest`) and on whether
# `tests/__init__.py` is present. Pinning it in a config file makes the
# test suite importable from a fresh shell regardless of invocation.
pythonpath = .
testpaths = tests